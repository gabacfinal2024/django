{% extends "base.html" %}
{% block title %}Authors{% endblock %}
{% block content %}
<h1>Authors</h1>
<p><a href="{% url 'library:author_create' %}" class="btn btn-primary">Add Author</a></p>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for a in authors %}
        <tr>
            <td>{{ a.pk }}</td>
            <td>{{ a.name }}</td>
            <td>{{ a.email }}</td>
            <td>
                <a href="{% url 'library:author_delete' a.pk %}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No authors yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
