{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'library:member_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
